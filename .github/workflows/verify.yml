name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vitest 5 (DOM tests) requires Node ^22.12 || ^24; the published package still targets Node >=20.
          node-version: "22"
          cache: "npm"
      # Strict install: no --legacy-peer-deps, lockfile must be in sync.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Builds the library (vite + tsc declarations), then runs the node:assert suites.
      - run: npm test
      # The publishable tarball must contain only dist/ + README + LICENSE + package.json.
      - run: npm pack --dry-run -w gridmaster-react
